[project]
name = "tolerance-radius"
version = "0.1.0"
description = "Measuring how far from its demonstrations an imitation policy still works, on a low-cost arm"
readme = "README.md"
requires-python = ">=3.12"
# The core runs on NumPy alone so that it imports in the rig's environment as it is. Matplotlib is needed for figures.
dependencies = ["numpy>=2.2"]

[project.optional-dependencies]
figures = ["matplotlib>=3.9"]
dev = ["pytest>=8", "ruff>=0.6", "scipy>=1.13"]

[tool.pytest.ini_options]
# Tests are unittest.TestCase classes: pytest runs them in the development environment, and
# `python -m unittest discover -s tests` runs the same files in the rig's environment, which has no pytest.
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests", "scripts", "analysis"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
